<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Decisionmaker Exercises — File Directory</title>
  <meta name="description" content="Directory of Decisionmaker exercise pages. Use search or filter tags to quickly find an exercise." />
  <link rel="icon" href="/favicon.svg" />
  <style>
    :root {
      /* Soft & Relaxing Ocean Blue Palette */
      --bg-gradient: linear-gradient(135deg, #0f172a 0%, #0e2a47 50%, #1e3a8a 100%);
      --card-bg: rgba(255, 255, 255, 0.05);
      --card-hover-bg: rgba(255, 255, 255, 0.12);
      --card-border: rgba(255, 255, 255, 0.1);
      
      --text-main: #f0f9ff;
      --text-muted: #93c5fd;
      
      --accent-blue: #38bdf8;
      --accent-hover: #7dd3fc;
      
      /* Level Badge Colors */
      --badge-a2: #38bdf8;
      --badge-b1: #818cf8;
      --badge-b2: #c084fc;
      --badge-c1: #f472b6;
      --badge-default: #94a3b8;

      --radius-lg: 16px;
      --radius-md: 10px;
      --radius-full: 9999px;
      --transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
    }

    *, *::before, *::after {
      box-sizing: border-box;
    }

    html, body {
      min-height: 100vh;
      margin: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
      color: var(--text-main);
      background: var(--bg-gradient);
      background-attachment: fixed;
      line-height: 1.5;
    }

    .site {
      max-width: 1280px;
      margin: 40px auto;
      padding: 32px;
      background: rgba(15, 23, 42, 0.6);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 24px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.4);
    }

    header {
      display: flex;
      flex-direction: column;
      gap: 20px;
      margin-bottom: 28px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      padding-bottom: 24px;
    }

    @media (min-width: 768px) {
      header {
        flex-direction: row;
        align-items: center;
        justify-content: space-between;
      }
    }

    .title h1 {
      margin: 0;
      font-size: 1.75rem;
      font-weight: 700;
      letter-spacing: -0.02em;
      color: #ffffff;
    }

    .title .muted {
      color: var(--text-muted);
      font-size: 0.95rem;
      margin-top: 4px;
    }

    .controls {
      display: flex;
      flex-direction: column;
      gap: 12px;
      min-width: 300px;
    }

    .search {
      width: 100%;
      padding: 12px 18px;
      border-radius: var(--radius-full);
      border: 1px solid var(--card-border);
      background: rgba(15, 23, 42, 0.6);
      color: var(--text-main);
      outline: none;
      font-size: 0.95rem;
      transition: var(--transition);
    }

    .search:focus {
      border-color: var(--accent-blue);
      box-shadow: 0 0 0 3px rgba(56, 189, 248, 0.25);
    }

    .search::placeholder {
      color: rgba(147, 197, 253, 0.5);
    }

    /* Filter Tag Buttons */
    .filter-tags {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
    }

    .filter-btn {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--card-border);
      color: var(--text-muted);
      padding: 4px 12px;
      border-radius: var(--radius-full);
      font-size: 0.8rem;
      font-weight: 600;
      cursor: pointer;
      transition: var(--transition);
    }

    .filter-btn:hover, .filter-btn.active {
      background: var(--accent-blue);
      color: #0f172a;
      border-color: var(--accent-blue);
    }

    /* 4-Column Grid Layout */
    .link-grid {
      display: grid;
      grid-template-columns: repeat(1, 1fr);
      gap: 16px;
      list-style: none;
      padding: 0;
      margin: 0;
    }

    @media (min-width: 540px) {
      .link-grid { grid-template-columns: repeat(2, 1fr); }
    }
    @media (min-width: 820px) {
      .link-grid { grid-template-columns: repeat(3, 1fr); }
    }
    @media (min-width: 1100px) {
      .link-grid { grid-template-columns: repeat(4, 1fr); }
    }

    .link-grid li {
      margin: 0;
    }

    /* Interactive Button Card Style */
    .exercise-btn {
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      height: 100%;
      min-height: 84px;
      text-decoration: none;
      padding: 16px;
      border-radius: var(--radius-md);
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      transition: var(--transition);
      position: relative;
      overflow: hidden;
    }

    .exercise-btn:hover {
      background: var(--card-hover-bg);
      border-color: rgba(56, 189, 248, 0.4);
      transform: translateY(-3px);
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.3);
    }

    .exercise-btn:focus-visible {
      outline: 2px solid var(--accent-blue);
      outline-offset: 2px;
    }

    .btn-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 8px;
    }

    .exercise-btn .title {
      font-weight: 600;
      font-size: 0.95rem;
      color: #ffffff;
      line-height: 1.3;
    }

    /* Badge Tags */
    .tag {
      font-size: 0.7rem;
      font-weight: 700;
      padding: 2px 8px;
      border-radius: var(--radius-full);
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: #0f172a;
      flex-shrink: 0;
      white-space: nowrap;
    }

    .tag-a2, .tag-a2-b1 { background: var(--badge-a2); }
    .tag-b1, .tag-b1-b2 { background: var(--badge-b1); }
    .tag-b2, .tag-b2-c1 { background: var(--badge-b2); }
    .tag-c1 { background: var(--badge-c1); }
    .tag-none { background: var(--badge-default); }

    .btn-footer {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      margin-top: 12px;
      font-size: 0.8rem;
      font-weight: 500;
      color: var(--accent-blue);
      gap: 4px;
    }

    .exercise-btn:hover .btn-footer {
      color: var(--accent-hover);
    }

    footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 32px;
      padding-top: 16px;
      border-top: 1px solid rgba(255, 255, 255, 0.08);
      color: var(--text-muted);
      font-size: 0.9rem;
    }

    #count {
      font-weight: 700;
      color: var(--accent-blue);
    }

    .skip {
      position: absolute;
      left: -9999px;
    }
    .skip:focus {
      left: 10px;
      top: 10px;
      background: var(--accent-blue);
      color: #000;
      padding: 8px;
      z-index: 100;
    }
  </style>
</head>
<body>
  <a class="skip" href="#main">Skip to main content</a>

  <div class="site">
    <header>
      <div class="title">
        <h1>Decisionmaker Exercises</h1>
        <div class="muted">Interactive scenarios for language learners</div>
      </div>

      <div class="controls" role="search">
        <input id="filter" class="search" type="search" placeholder="Search exercises (press '/' to focus)" aria-label="Search pages" />
        <div class="filter-tags">
          <button class="filter-btn active" data-level="all">All</button>
          <button class="filter-btn" data-level="a2-b1">A2-B1</button>
          <button class="filter-btn" data-level="b1-b2">B1-B2</button>
          <button class="filter-btn" data-level="b2-c1">B2-C1</button>
          <button class="filter-btn" data-level="c1">C1</button>
        </div>
      </div>
    </header>

    <main id="main">
      <nav aria-label="exercise directory">
        <ul id="pages" class="link-grid" aria-live="polite">
          <li>Loading exercises…</li>
        </ul>
      </nav>
    </main>

    <footer>
      <div>Decisionmaker Directory</div>
      <div>Showing <span id="count">0</span> exercises</div>
    </footer>
  </div>

  <script>
    (function(){
      const input = document.getElementById('filter');
      const list = document.getElementById('pages');
      let items = [];
      const count = document.getElementById('count');
      const filterBtns = document.querySelectorAll('.filter-btn');

      let currentLevel = 'all';

      // Level replacement lookup
      const levelMap = {
        'A2': 'A2-B1',
        'B1': 'B1-B2',
        'B2': 'B2-C1',
        'C1': 'C1'
      };

      // Utility function to convert raw levels anywhere in the DOM
      function transformTagElement(tagEl) {
        if (!tagEl) return;
        const txt = tagEl.textContent.trim().toUpperCase();
        if (levelMap[txt]) {
          tagEl.textContent = levelMap[txt];
          tagEl.className = 'tag tag-' + txt.toLowerCase();
        }
      }

      function updateCount(){
        const visible = items.filter(li => li.style.display !== 'none').length;
        count.textContent = visible;
      }

      function applyFilters(){
        const query = input.value.trim().toLowerCase();
        items.forEach(li => {
          const text = li.textContent.toLowerCase();
          const tag = li.querySelector('.tag');
          
          if (tag) transformTagElement(tag);
          
          const level = tag ? tag.textContent.trim().toLowerCase() : '';

          const matchesQuery = query === '' || text.includes(query);
          const matchesLevel = currentLevel === 'all' || level.startsWith(currentLevel.toLowerCase());

          if (matchesQuery && matchesLevel) {
            li.style.display = '';
          } else {
            li.style.display = 'none';
          }
        });

        updateCount();
      }

      function debounce(fn, wait){
        let t = null;
        return function(...args){
          clearTimeout(t);
          t = setTimeout(() => fn.apply(this, args), wait);
        };
      }

      filterBtns.forEach(btn => {
        btn.addEventListener('click', (e) => {
          filterBtns.forEach(b => b.classList.remove('active'));
          e.target.classList.add('active');
          currentLevel = e.target.getAttribute('data-level');
          applyFilters();
        });
      });

      window.addEventListener('keydown', e => {
        if (e.key === '/' && document.activeElement.tagName !== 'INPUT') {
          e.preventDefault();
          input.focus();
        }
      });

      input.addEventListener('input', debounce(applyFilters, 150));

      // Fetch repository contents with cache-busting timestamp
      fetch('https://api.github.com/repos/LaurenceJIL/decisionmaker/contents?t=' + Date.now())
        .then(res => res.json())
        .then(files => {
          const htmlFiles = (files || []).filter(f => f.type === 'file' && f.name.endsWith('.html') && !/^index\.html$/i.test(f.name) && !/^(README|styles|favicon)\./i.test(f.name));

          htmlFiles.sort((a,b) => a.name.localeCompare(b.name));
          list.innerHTML = '';

          htmlFiles.forEach(f => {
            const name = f.name;
            const base = name.replace(/\.html$/i, '');

            // 1. EXTRACT raw level suffix BEFORE stripping it from base string
            const levelMatch = base.match(/-(a2|b1\+|b1|b2|c1)$/i);
            const rawLevel = levelMatch ? levelMatch[1].toUpperCase().replace('+','') : null;
            
            // 2. Map level badge string
            const displayLevel = rawLevel ? (levelMap[rawLevel] || rawLevel) : null;
            const tagClass = rawLevel ? ('tag-' + rawLevel.toLowerCase()) : 'tag-none';
            const tagText = displayLevel || '—';

            // 3. Construct display title
            let title = base.replace(/-(a2|b1\+|b1|b2|c1)$/i, '').replace(/-/g, ' ');
            title = title.split(' ').map(w => w.charAt(0).toUpperCase() + w.slice(1)).join(' ');

            const li = document.createElement('li');
            const a = document.createElement('a');
            a.className = 'exercise-btn';
            a.href = name;
            a.setAttribute('role', 'link');

            a.innerHTML = `
              <div class="btn-header"><span class="title">${escapeHtml(title)}</span><span class="tag ${tagClass}">${escapeHtml(tagText)}</span></div>
              <div class="btn-footer">Open &rarr;</div>
            `;

            li.appendChild(a);
            list.appendChild(li);
          });

          items = Array.from(list.querySelectorAll('li'));
          applyFilters();
        })
        .catch(err => {
          console.error('Failed to load repository contents', err);
          
          // Fallback: If API fails/throttles, force-rewrite any existing static DOM items
          items = Array.from(list.querySelectorAll('li'));
          items.forEach(li => {
            const tag = li.querySelector('.tag');
            if (tag) transformTagElement(tag);
          });
          applyFilters();
        });

      function escapeHtml(str) {
        return String(str).replace(/[&"'<>]/g, function(s) {
          return ({'&':'&amp;','"':'&quot;','\'':'&#39;','<':'&lt;','>':'&gt;'})[s];
        });
      }

    })();
  </script>
</body>
</html>
