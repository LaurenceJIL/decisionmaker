<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>New York City Adventure — A2 Level 3-Day Trip</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght=700&family=Lato:wght=400;700&display=swap" rel="stylesheet">
<style>
  :root {
    --ny-yellow: #fbc02d;
    --ny-blue: #0d47a1;
    --ny-grey: #37474f;
    --danger: #c0392b;
    --text: #2c3e50;
    --bg: #f0f2f5;
  }

  body { font-family: 'Lato', sans-serif; background-color: var(--bg); color: var(--text); margin: 0; display: flex; flex-direction: column; align-items: center; }
  .header { background: var(--ny-grey); color: white; width: 100%; padding: 15px; text-align: center; position: sticky; top: 0; z-index: 10; border-bottom: 5px solid var(--ny-yellow); }
  
  .stats-bar { display: flex; justify-content: space-around; background: #fff; width: 100%; padding: 10px 0; border-bottom: 2px solid #ddd; font-weight: bold; }
  .stat-item { display: flex; align-items: center; gap: 5px; }

  .progress-bar { width: 100%; height: 8px; background: #ddd; }
  .progress-fill { height: 100%; background: var(--ny-yellow); width: 0%; transition: 0.5s; }

  .game-container { max-width: 800px; width: 90%; margin: 20px auto; background: white; padding: 30px; border-radius: 15px; box-shadow: 0 4px 20px rgba(0,0,0,0.1); min-height: 400px; }
  .choice-list { display: flex; flex-direction: column; gap: 12px; margin-top: 20px; }

  .choice-btn { 
    padding: 18px; border: 2px solid #eee; border-radius: 8px; background: white; 
    cursor: pointer; font-size: 1rem; text-align: left; transition: 0.2s;
    display: flex; justify-content: space-between; align-items: center;
  }
  .choice-btn:hover:not(:disabled) { border-color: var(--ny-yellow); background: #fffde7; transform: translateX(5px); }
  .choice-btn:disabled { opacity: 0.6; cursor: not-allowed; }
  
  .price-tag { padding: 2px 8px; border-radius: 4px; font-size: 0.85rem; font-weight: bold; }
  .cost-tag { background: #eee; color: #333; }

  .feedback { margin-top: 20px; padding: 20px; border-radius: 8px; display: none; line-height: 1.6; border-left: 5px solid var(--ny-yellow); font-size: 1.05rem; }
  .feedback.error { border-left-color: var(--danger); background-color: #fdf2f2; }
  .btn-next { display: none; margin-top: 20px; padding: 15px 30px; background: var(--ny-grey); color: white; border: none; border-radius: 5px; cursor: pointer; font-weight: bold; width: 100%; font-size: 1.1rem; }

  .vocab-section { margin-top: 30px; background: #f9f9f9; padding: 20px; border-radius: 10px; text-align: left; border-top: 4px solid var(--ny-yellow); }
  .vocab-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-top: 10px; }
  .vocab-item { font-size: 0.95rem; line-height: 1.4; }
  .vocab-item b { color: var(--ny-grey); }

  #landingPage {
    position: fixed; inset: 0; z-index: 100;
    background: var(--ny-blue);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    padding: 30px;
  }

  .landing-inner { max-width: 680px; width: 100%; text-align: center; color: white; }
  .landing-title { font-family: 'Playfair Display', serif; font-size: 3.5rem; margin-bottom: 10px; color: var(--ny-yellow); }
  .landing-btn { padding: 17px 48px; background: var(--ny-yellow); color: #000; font-weight: 700; border: none; border-radius: 6px; cursor: pointer; margin-top: 20px; text-transform: uppercase; }
</style>
</head>
<body>

<div id="landingPage">
  <div class="landing-inner">
    <h1 class="landing-title">NYC Trip</h1>
    <p>Welcome to New York City! You have <strong>$600</strong> for a 3-day trip.</p>
    <p>Try to get many <b>Fun Points</b>. Don't spend all your money!</p>
    <button class="landing-btn" onclick="startGame()">Start Trip →</button>
  </div>
</div>

<div class="header">
  <h1>🗽 My New York Journey</h1>
</div>

<div class="stats-bar">
  <div class="stat-item">⭐ Fun Points: <span id="scoreDisplay">0</span></div>
  <div class="stat-item">💰 Money: <span id="budgetDisplay">$600</span></div>
</div>

<div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>

<div class="game-container" id="gameWindow">
  <h2 id="stepTitle">Loading...</h2>
  <p id="stepDesc">Loading the game...</p>
  <div class="choice-list" id="choiceList"></div>
  <div class="feedback" id="feedbackBox"></div>
  <button class="btn-next" id="nextBtn" onclick="nextStep()">Continue →</button>
</div>

<script>
let currentStepIndex = 0;
let score = 0;
let budget = 600;

const gameData = [
  // DAY 1
  {
    title: "Day 1 — Step 1: Arriving in New York",
    desc: "You are at JFK Airport. How do you want to go to your hotel in the city?",
    choices: [
      { text: "Take the train and the subway.", cost: 12, pts: 10, fb: "<b>Good job!</b> This is cheap and fast. You can travel like a real New York citizen." },
      { text: "Take a yellow taxi cab.", cost: 75, pts: 20, fb: "<b>Exciting!</b> You see the big buildings from the window, but the taxi is expensive." },
      { text: "Rent a big, luxury limousine car.", cost: 180, pts: 35, fb: "<b>Amazing!</b> You feel like a rich movie star, but it costs too much money." },
      { text: "Walk to the city on the big highway road.", cost: 0, pts: 0, type: "poor", fb: "<b>Stop!</b> Walking on a highway is not safe and it takes 5 hours. Choose something else!" }
    ]
  },
  {
    title: "Day 1 — Step 2: Morning Walk",
    desc: "The sun is shining. Where do you want to go first?",
    choices: [
      { text: "Go to the Top of the Rock observation deck.", cost: 45, pts: 25, fb: "<b>Beautiful!</b> You go up to the 70th floor. You can see all of Central Park and the city below." },
      { text: "Visit Grand Central Train Station.", cost: 15, pts: 15, fb: "<b>Interesting!</b> You see the beautiful blue ceiling with stars on it and learn about old trains." },
      { text: "Walk around Rockefeller Center plaza.", cost: 0, pts: 10, fb: "<b>Nice!</b> It is free. You can see famous statues and see many people walking by." },
      { text: "Climb a tall construction machine to look at the city.", cost: 0, pts: 0, type: "poor", fb: "<b>No!</b> That is illegal and very dangerous. You can fall. Choose a safe option!" }
    ]
  },
  {
    title: "Day 1 — Step 3: Lunch Time",
    desc: "You are hungry. What do you want to eat for lunch?",
    choices: [
      { text: "Buy a slice of hot cheese pizza on the street.", cost: 5, pts: 15, fb: "<b>Delicious!</b> You eat it outside. It is very cheap and tastes wonderful." },
      { text: "Eat at a fun Broadway diner restaurant.", cost: 35, pts: 18, fb: "<b>Fun!</b> The waiters sing popular songs while they bring you a burger and french fries." },
      { text: "Buy chicken and rice from a street food cart.", cost: 12, pts: 15, fb: "<b>Great choice!</b> The food smells amazing and gives you energy for the afternoon." },
      { text: "Look inside a trash can for food leftovers.", cost: 0, pts: 0, type: "poor", fb: "<b>Yuck!</b> That is dirty. You have enough money to buy real, clean food. Try again!" }
    ]
  },
  {
    title: "Day 1 — Step 4: The First Night",
    desc: "It is dark now and the city lights are on. What do you want to do?",
    choices: [
      { text: "Buy tickets for a famous Broadway theater show.", cost: 140, pts: 40, fb: "<b>Wonderful!</b> The actors, music, and colorful costumes are fantastic." },
      { text: "Walk through Times Square to see the big screens.", cost: 0, pts: 15, fb: "<b>Bright!</b> There are many neon lights and people. It is free and beautiful." },
      { text: "Go to a high rooftop café to see the view.", cost: 30, pts: 20, fb: "<b>Nice!</b> You drink something cold and watch the cars drive below you." },
      { text: "Try to run onto the theater stage during a show.", cost: 0, pts: 0, type: "poor", fb: "<b>Bad idea!</b> The police will catch you. You cannot do that. Choose an ordinary activity!" }
    ]
  },
  // EMERGENCY 1
  {
    title: "🚨 EMERGENCY: Lost MetroCard!",
    desc: "Oh no! Your subway ticket fell out of your pocket. It is gone!",
    choices: [
      { text: "Buy a new subway ticket at the station machine.", cost: 20, pts: 5, fb: "<b>Good.</b> You lose a little money, but now you can ride the subway again." },
      { text: "Use your smartphone to pay at the gate.", cost: 3, pts: 12, fb: "<b>Smart!</b> The subway machine can scan your phone. It is very cheap and quick." },
      { text: "Jump over the subway gate so you do not pay.", cost: 0, pts: 0, type: "poor", fb: "<b>Don't do that!</b> Jumping the gate is against the law. You can get a big fine. Pay for a ticket!" }
    ]
  },
  // DAY 2
  {
    title: "Day 2 — Step 5: Day 2 Morning",
    desc: "Good morning! It is a beautiful day. Where do you want to go?",
    choices: [
      { text: "Rent a bicycle to ride around Central Park.", cost: 25, pts: 22, fb: "<b>Healthy!</b> You ride past trees, fountains, and lakes. It is a fast way to see the park." },
      { text: "Visit the 9/11 Memorial and Museum.", cost: 30, pts: 25, fb: "<b>Important history.</b> You see the large water fountains and learn about the city's past." },
      { text: "Walk across the famous Brooklyn Bridge.", cost: 0, pts: 18, fb: "<b>Great view!</b> Walking across this old bridge is free and you can take beautiful photos." },
      { text: "Jump into the park lake for a swim.", cost: 0, pts: 0, type: "poor", fb: "<b>No!</b> Swimming is not allowed in the park pools. It is dangerous. Pick something else!" }
    ]
  },
  {
    title: "Day 2 — Step 6: Afternoon Lunch",
    desc: "You are walking in Chinatown. What do you want to eat?",
    choices: [
      { text: "Eat hot Chinese dumplings in a small restaurant.", cost: 18, pts: 20, fb: "<b>Yummy!</b> The food is cheap, warm, and traditional. You enjoy it a lot." },
      { text: "Go to a very expensive, modern bistro café.", cost: 55, pts: 22, fb: "<b>Fancy!</b> You eat a fresh salad and see a famous internet star sitting near you." },
      { text: "Eat a big meat sandwich at a famous old deli.", cost: 32, pts: 25, fb: "<b>Huge!</b> The sandwich has a lot of meat. It is a famous New York food experience." },
      { text: "Try to eat a plastic food model from a shop window.", cost: 10, pts: 0, type: "poor", fb: "<b>Silly!</b> That is toy food for display, not real lunch. Buy something you can eat!" }
    ]
  },
  {
    title: "Day 2 — Step 7: Visiting a Museum",
    desc: "Let's look at some world-famous art. Which museum do you choose?",
    choices: [
      { text: "Go to the Metropolitan Museum of Art (The Met).", cost: 30, pts: 28, fb: "<b>Incredible!</b> You see old Egyptian statues and beautiful paintings from Europe." },
      { text: "See modern art at the MoMA museum.", cost: 25, pts: 22, fb: "<b>Cool!</b> You see colorful, strange, and exciting paintings by modern artists." },
      { text: "Walk around free art galleries in Chelsea.", cost: 0, pts: 15, fb: "<b>Interesting!</b> It is free to enter these small shops and look at new art pieces." },
      { text: "Draw a picture on the museum wall with a marker.", cost: 0, pts: 0, type: "poor", fb: "<b>Stop!</b> You cannot draw on museum walls. That is illegal graffiti. Choose a better option!" }
    ]
  },
  {
    title: "Day 2 — Step 8: Evening in Brooklyn",
    desc: "You go to Brooklyn for the evening. What do you want to do?",
    choices: [
      { text: "Go to a live music concert.", cost: 45, pts: 25, fb: "<b>Loud and fun!</b> You listen to a new rock band and dance with young people." },
      { text: "Sit in the park near the river at sunset.", cost: 0, pts: 18, fb: "<b>Relaxing!</b> You watch the sun go down and see the city buildings start to shine." },
      { text: "Go on a big dinner boat cruise in the water.", cost: 110, pts: 35, fb: "<b>Luxury!</b> You eat nice food while sailing past the Statue of Liberty at night." },
      { text: "Start a fight with a group of street dancers.", cost: 0, pts: 0, type: "poor", fb: "<b>Dangerous!</b> That is a bad idea. Be friendly and choose a real activity!" }
    ]
  },
  // EMERGENCY 2
  {
    title: "🚨 EMERGENCY: Big Rainstorm!",
    desc: "Suddenly, a very big rainstorm starts! Water is falling everywhere!",
    choices: [
      { text: "Buy an expensive umbrella from a street seller.", cost: 15, pts: 5, fb: "<b>Dry!</b> The umbrella breaks later, but it keeps you dry for now." },
      { text: "Go inside the public library to wait for the rain to stop.", cost: 0, pts: 10, fb: "<b>Smart!</b> You stay dry, save your money, and look at old books for free." },
      { text: "Stand in the cold rain until your clothes are wet.", cost: 0, pts: 0, type: "gameover", fb: "<b>GAME OVER!</b> You get very wet and sick. You must stay in bed for the rest of your trip!" }
    ]
  },
  // DAY 3
  {
    title: "Day 3 — Step 9: Famous Places",
    desc: "It is your last day! What famous place do you want to see?",
    choices: [
      { text: "Take a boat ferry to see the Statue of Liberty.", cost: 25, pts: 30, fb: "<b>Great!</b> You stand near the huge green statue and learn about American history." },
      { text: "Walk on the High Line park path.", cost: 0, pts: 20, fb: "<b>Beautiful!</b> This is an old train track turned into a park with flowers above the streets." },
      { text: "Pay for a short helicopter ride over the city.", cost: 210, pts: 50, fb: "<b>Amazing!</b> You fly high in the air next to the buildings. Very expensive, but you will never forget it." },
      { text: "Try to swim across the wide river to the statue.", cost: 0, pts: 0, type: "poor", fb: "<b>No!</b> The water is too cold and big boats are dangerous. Use the tourist boat ferry!" }
    ]
  },
  {
    title: "Day 3 — Step 10: Souvenir Lunch",
    desc: "Where do you want to eat lunch and buy gifts for your family?",
    choices: [
      { text: "Eat at Chelsea Market and buy handmade gifts.", cost: 40, pts: 20, fb: "<b>Great food!</b> You eat seafood and buy nice postcards and toys from local artists." },
      { text: "Buy a cheap hot dog and a New York T-shirt outside.", cost: 8, pts: 12, fb: "<b>Classic!</b> You eat quickly on the street and get a nice, cheap shirt." },
      { text: "Go to a luxury chocolate shop for sweet gifts.", cost: 50, pts: 22, fb: "<b>Sweet!</b> You try delicious candy and buy beautiful boxes of chocolate for your friends." },
      { text: "Steal a red traffic sign from the street.", cost: 0, pts: 0, type: "poor", fb: "<b>Don't steal!</b> Taking city property is illegal. Buy a normal gift in a gift shop!" }
    ]
  },
  {
    title: "Day 3 — Step 11: Afternoon Relaxation",
    desc: "Your trip is almost finished. How do you spend your last hours?",
    choices: [
      { text: "Visit the big modern shopping mall at Hudson Yards.", cost: 10, pts: 15, fb: "<b>Modern!</b> You see strange modern buildings and look at luxury shops." },
      { text: "Sit in Washington Square Park and listen to musicians.", cost: 0, pts: 18, fb: "<b>Peaceful!</b> You sit near a big stone arch and listen to people playing the piano." },
      { text: "Ride the Roosevelt Island overhead cable car.", cost: 3, pts: 20, fb: "<b>Great view!</b> You fly over the river in a red cable car for the price of a subway ticket." },
      { text: "Lie down on the road in front of city buses to sleep.", cost: 0, pts: 0, type: "poor", fb: "<b>Dangerous!</b> Buses cannot see you on the road. Find a safe park bench to sit on!" }
    ]
  },
  {
    title: "Day 3 — Step 12: Final Evening Goodbye",
    desc: "It is your last hour before you go to the airport. How do you say goodbye?",
    choices: [
      { text: "Listen to live music at an old jazz club.", cost: 45, pts: 30, fb: "<b>Relaxing sounds!</b> You listen to piano and saxophone music. It is a beautiful end to your trip." },
      { text: "Look at the city lights from the Brooklyn park.", cost: 0, pts: 15, fb: "<b>Quiet.</b> You look across the dark water at the shiny buildings and smile." },
      { text: "Eat a big, expensive steak dinner at a restaurant.", cost: 120, pts: 35, fb: "<b>Excellent food!</b> You eat a wonderful meal with great service to celebrate your trip." },
      { text: "Hide inside a small train locker so you don't leave.", cost: 0, pts: 0, type: "poor", fb: "<b>Impossible!</b> The lockers are too small and you must go home. Say goodbye like a regular person!" }
    ]
  }
];

const vocabulary = [
  { word: "Subway", def: "An electric train that travels under the ground." },
  { word: "Observation Deck", def: "A high place on a tall building where people look at the view." },
  { word: "Souvenir", def: "Something small you buy to remember a city or a place." },
  { word: "Ferry", def: "A boat that carries passengers across a river or lake." },
  { word: "Bistro", def: "A small, cozy restaurant or café." },
  { word: "Highway", def: "A large, fast road for cars and trucks." }
];

function shuffleArray(array) {
  for (let i = array.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [array[i], array[j]] = [array[j], array[i]];
  }
}

function loadStep() {
  const step = gameData[currentStepIndex];
  document.getElementById("stepTitle").innerText = step.title;
  document.getElementById("stepDesc").innerHTML = step.desc;
  
  const list = document.getElementById("choiceList");
  list.innerHTML = "";
  
  const shuffledChoices = [...step.choices];
  shuffleArray(shuffledChoices);
  
  shuffledChoices.forEach((c) => {
    const btn = document.createElement("button");
    btn.className = "choice-btn";
    const canAfford = budget >= c.cost;
    
    if (!canAfford && c.type !== "poor" && c.type !== "gameover") {
        btn.disabled = true;
    }

    btn.innerHTML = `<span>${c.text} ${(!canAfford && c.type !== "poor" && c.type !== "gameover") ? '<b style="color:red">(Too expensive!)</b>' : ''}</span>
      <span class="price-tag cost-tag">$${c.cost}</span>`;
    
    btn.onclick = () => selectChoice(c);
    list.appendChild(btn);
  });
  
  document.getElementById("feedbackBox").style.display = "none";
  document.getElementById("nextBtn").style.display = "none";
  
  const progress = (currentStepIndex / gameData.length) * 100;
  document.getElementById("progressFill").style.width = progress + "%";
}

function selectChoice(choice) {
  const fb = document.getElementById("feedbackBox");
  
  if (choice.type === "gameover") {
    fb.innerHTML = choice.fb;
    fb.className = "feedback error";
    fb.style.display = "block";
    document.querySelectorAll(".choice-btn").forEach(b => b.disabled = true);
    document.getElementById("nextBtn").innerText = "Restart Game ↩";
    document.getElementById("nextBtn").onclick = () => location.reload();
    document.getElementById("nextBtn").style.display = "block";
    return;
  }

  if (choice.type === "poor") {
    fb.innerHTML = choice.fb;
    fb.className = "feedback error";
    fb.style.display = "block";
    return;
  }

  budget -= choice.cost;
  score += choice.pts;
  
  document.getElementById("scoreDisplay").innerText = score;
  document.getElementById("budgetDisplay").innerText = "$" + budget;
  
  fb.innerHTML = choice.fb;
  fb.className = "feedback";
  fb.style.display = "block";
  
  document.querySelectorAll(".choice-btn").forEach(b => b.disabled = true);
  document.getElementById("nextBtn").style.display = "block";
}

function nextStep() {
  currentStepIndex++;
  if (currentStepIndex >= gameData.length) {
    renderFinalScreen();
  } else {
    loadStep();
  }
}

function renderFinalScreen() {
  let title, message;
  
  if (score >= 260) {
    title = "🥇 King of New York!";
    message = "Amazing! You had a perfect trip. You saw the best things, ate wonderful food, and saved your money well.";
  } else if (score >= 160) {
    title = "🥈 Experienced Tourist";
    message = "Great job! You had a classic New York trip. You saw many big sights and handled the emergencies well.";
  } else {
    title = "🥉 NYC Survivor";
    message = "You made it home! The trip was a bit difficult for you, but you learned a lot about the big city.";
  }

  let vocabHTML = `<div class="vocab-section"><h3>New Words Learned:</h3><div class="vocab-grid">`;
  vocabulary.forEach(v => { vocabHTML += `<div class="vocab-item"><b>${v.word}:</b> ${v.def}</div>`; });
  vocabHTML += `</div></div>`;

  document.getElementById("gameWindow").innerHTML = `
    <h2 style="color:var(--ny-blue)">${title}</h2>
    <p>${message}</p>
    <hr>
    <div style="font-size: 1.2rem; margin: 20px 0;">
      <p>Final Fun Points: <b>${score}</b></p>
      <p>Money Left: <b>$${budget}</b></p>
    </div>
    ${vocabHTML}
    <button class="btn-next" style="display:block" onclick="location.reload()">Play Again ↩</button>
  `;
  document.getElementById("progressFill").style.width = "100%";
}

function startGame() { 
  document.getElementById("landingPage").style.display = "none"; 
  loadStep();
}
</script>
</body>
</html>
