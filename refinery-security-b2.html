<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Refinery Security & Training Chief — B2 Interactive</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,600;1,400&family=DM+Sans:ital,wght@0,300;0,400;0,500;1,400&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#F3F4F6;--surface:#FFFFFF;--surface2:#F9FAFB;--surface3:#E5E7EB;
  --ink:#111827;--ink2:#374151;--ink3:#6B7280;
  --rule:rgba(17,24,39,0.08);
  --green-bg:#F0FDF4;--green-bd:#22C55E;--green-tx:#166534;
  --amber-bg:#FFFBEB;--amber-bd:#F59E0B;--amber-tx:#92400E;
  --red-bg:#FEF2F2;--red-bd:#EF4444;--red-tx:#991B1B;
  --blue-bg:#EFF6FF;--blue-bd:#3B82F6;--blue-tx:#1E40AF;
  --purple-bg:#FAF5FF;--purple-bd:#A855F7;--purple-tx:#6B21A8;
  --rxl:16px;--rs:8px;
}
body{font-family:'DM Sans',sans-serif;background:var(--bg);color:var(--ink);line-height:1.6}
.shell{max-width:750px;margin:2rem auto;padding:0 1rem}
.card{background:var(--surface);border-radius:var(--rxl);box-shadow:0 10px 25px -5px rgba(0,0,0,0.05);overflow:hidden;border:1px solid var(--rule)}
.card-bar{display:flex;align-items:center;justify-content:space-between;padding:1rem 1.5rem;background:#fff;border-bottom:1px solid var(--rule)}
.progress-track{display:flex;gap:4px}
.dot{width:10px;height:10px;border-radius:50%;background:var(--surface3)}
.dot.done{background:var(--green-bd)}
.dot.active{background:var(--blue-bd)}
.dot.emg{background:var(--red-bd);animation:pulse 1.2s infinite}
@keyframes pulse{0%{opacity:1}50%{opacity:0.4}100%{opacity:1}}
.score-chip{font-family:'DM Mono',monospace;font-size:13px;background:var(--blue-bg);color:var(--blue-tx);padding:4px 12px;border-radius:20px;border:1px solid var(--blue-bd)}
.card-body{padding:1.5rem;animation:slideUp 0.35s ease-out}
@keyframes slideUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.time-label{font-family:'DM Mono',monospace;font-size:11px;color:var(--ink3);text-transform:uppercase;letter-spacing:0.05em;margin-bottom:0.5rem}
.vocab-row{margin-bottom:1rem;display:flex;flex-wrap:wrap;gap:4px}
.vpill{font-family:'DM Mono',monospace;font-size:10px;background:var(--surface2);color:var(--ink2);padding:2px 8px;border-radius:12px;border:1px solid var(--rule)}
.scenario{font-size:16px;margin-bottom:1.5rem;color:var(--ink);font-weight:400}
.opt{width:100%;text-align:left;padding:14px;background:var(--surface);border:1px solid var(--rule);border-radius:var(--rs);cursor:pointer;margin-bottom:10px;font-size:14px;transition:0.15s;display:flex;justify-content:space-between;align-items:center;color:var(--ink)}
.opt:hover{background:var(--surface2);border-color:var(--ink3)}
.opt:disabled{opacity:0.6;cursor:not-allowed;background:var(--surface3)}
.fbox{margin-top:1rem;padding:1rem;border-radius:var(--rs);font-size:14px;display:none;border-left:4px solid}
.fbox.show{display:block}
.disc-box{margin-top:0.75rem;padding:0.85rem 1rem;border-radius:var(--rs);font-size:13px;font-style:italic;background:var(--purple-bg);border-left:4px solid var(--purple-bd);color:var(--purple-tx);display:none}
.disc-box.show{display:block}
.nxt{margin-top:1.5rem;padding:12px 24px;background:var(--ink);color:#fff;border:none;border-radius:var(--rs);cursor:pointer;display:none;float:right;font-weight:600}
.nxt.show{display:block}
.final-screen{padding:2.5rem}
.band-box{margin:1.5rem 0;padding:1.5rem;border-radius:var(--rs);text-align:left}
.band-1{background:var(--green-bg);border:1px solid var(--green-bd);color:var(--green-tx)}
.band-2{background:var(--blue-bg);border:1px solid var(--blue-bd);color:var(--blue-tx)}
.band-3{background:var(--amber-bg);border:1px solid var(--amber-bd);color:var(--amber-tx)}
.band-4{background:var(--red-bg);border:1px solid var(--red-bd);color:var(--red-tx)}

.glossary-section {margin-top:2.5rem; border-top:2px solid var(--surface3); padding-top:1.5rem;}
.glossary-title {font-family:Lora; font-size:22px; margin-bottom:1.2rem;}
.glossary-grid {display:grid; grid-template-columns:1fr; gap:15px;}
.g-item {background:var(--surface2); padding:12px; border-radius:var(--rs); border:1px solid var(--rule);}
.g-term {font-family:'DM Mono',monospace; font-weight:600; color:var(--blue-tx); display:block; margin-bottom:4px; font-size:14px;}
.g-def {font-size:13px; color:var(--ink2); display:block;}
.g-note {font-size:11px; color:var(--ink3); font-style:italic; margin-top:4px; display:block;}
</style>
</head>
<body>

<div class="shell">
  <div class="card" id="main-card">
    <div class="card-bar" id="card-bar" style="display:none">
      <div style="font-family:Lora;font-weight:600">Refinery Security Simulation</div>
      <div style="display:flex;align-items:center;gap:15px">
        <div class="progress-track" id="dots"></div>
        <div class="score-chip" id="score">0 pts</div>
      </div>
    </div>
    <div id="content"></div>
  </div>
</div>

<script>

  { term: "Phishing", def: "The fraudulent attempt to obtain sensitive data, such as SCADA access credentials, by disguising as a trustworthy entity.", note: "Industrial control systems are frequent targets of sophisticated spear-phishing." },
  { term: "SCADA System", def: "Supervisory Control and Data Acquisition; the digital system that monitors and controls refinery plant industrial processes.", note: "A breach here can give threat actors control over physical valves and boilers." },

const DATA = {

      { t: "Temporarily bypass biometrics and check ID badges visually to speed up entry.", pts: 1, fb: "Suboptimal. Visual ID checks are easily forged or rushed by distracted guards.", disc: "How would you justify delaying a shift to a production manager who prioritizes speed over access security?" },
      { t: "Hold the line. Deploy two extra training officers to manage the queue and verify credentials properly.", pts: 3, fb: "Excellent. Security protocols cannot be sacrificed for scheduling conveniences.", disc: "What strategies can security teams use to manage large groups of workers during high-volume turnarounds?" },
      { t: "Open the vehicular cargo gates to let large groups walk through uninspected.", pts: -1, fb: "Poor Choice. You have completely compromised access control. Lose 1 point and choose again.", disc: "What are the immediate legal liabilities if an unvetted individual enters a hazardous processing zone?" }
    ],
    next: "d2"
  },
  d2: {
    label: "DAY 1: 09:30 — Induction Shortcut",
    scene: "An external maintenance crew arrives to patch a vital pipeline. Their mandatory 2-hour Safety Induction training hasn't been completed. Their foreman asks you to sign them off anyway.",
    vocab: ["induction", "compliance", "maintenance"],
    opts: [
      { t: "Refuse. Insist they complete the full safety induction module before entering the site.", pts: 3, fb: "Correct. Uncontrolled personnel lack awareness of volatile refinery hazards.", disc: "In what ways can safety induction modules be streamlined without compromising essential legal requirements?" },

      { t: "Sign the training forms without them doing the class to keep the pipeline project online.", pts: -1, fb: "Poor Choice. You are legally liable if they cause an incident. Lose 1 point and choose again.", disc: "How does falsifying compliance documentation destroy professional accountability during incident investigations?" }
    ],
    next: "d3"
  },
  d3: {
    label: "DAY 1: 11:45 — The Perimeter Breach",
    scene: "A security guard reports a cutout section in the secondary perimeter fence line. Footprints lead toward the crude storage tank farm.",
    vocab: ["perimeter", "vulnerability", "breach"],
    opts: [

    opts: [

    vocab: ["discrepancy", "muster point", "metrics"],

      { t: "Document the infraction, launch an immediate independent retraining cycle, and initiate disciplinary actions.", pts: 3, fb: "Superb integrity. Accurate emergency statistics are vital for real-world readiness.", disc: "How can organizations encourage honest metric reporting when managers face heavy corporate pressure?" },

    ],

  },

    label: "DAY 2: 15:45 — Media Pressure",
    scene: "A minor, non-toxic steam venting incident causes black smoke over the refinery. A local investigative reporter bypasses the main gate and calls your direct phone line demanding comments on 'the chemical leak'.",
    vocab: ["media protocol", "reputation"],
    opts: [
      { t: "Answer the questions briefly off-the-record to ensure they don't print exaggerated fabrications.", pts: 1, fb: "Risky. Off-the-record comments are routinely misquoted or taken out of context.", disc: "Why are off-the-record statements notoriously dangerous when communicating with investigative journalists?" },
      { t: "Refuse to comment directly and immediately route the call to the certified Corporate Public Relations Officer.", pts: 3, fb: "Correct protocol. Media operations require unified, factual communications channels.", disc: "How does strict media protocol alignment protect both public safety and corporate reputation?" },

    ],
    next: "emergency2"
  },

  // --- EMERGENCY 2 ---

    vocab: ["hydrocarbon", "ignition", "emergency"],
    opts: [
      { t: "Order an immediate facility-wide shutdown, isolate electrical grids, and actuate the water deluge curtains.", isSafe: true, fb: "Perfect crisis mitigation. You suppressed potential ignition points instantly.", disc: "How do automated water deluge systems help suppress flammable vapor clouds in industrial tank farms?" },
      { t: "Send a security guard out into the vapor area with a standard vehicle to check if the sensor is broken.", isGameOver: true, fb: "<strong>GAME OVER.</strong> Unmitigated disaster. The vehicle’s internal combustion engine sparks the hydrocarbon cloud, causing a devastating industrial explosion.", disc: "Why are standard combustion engine vehicles strictly prohibited near volatile hydrocarbon gas leaks?" }
    ],
    next: "d9"
  },

  // --- DAY 3 ---
  d9: {
    label: "DAY 3: 08:30 — VIP Interruption",
    scene: "A delegation of international board executives arrives for a facility tour. The Regional Director asks you to skip their mandatory gate safety verification screening to save time.",
    vocab: ["screening", "delegation", "protocol"],
    opts: [

      { t: "Give them a shortened 10-second verbal summary while walking down the main corridor.", pts: 1, fb: "Compromised control. Executives are just as vulnerable to refinery hazards as anyone else.", disc: "What liabilities does a company face if an unvetted executive is injured during an informal facility walkthrough?" },
      { t: "Let them pass completely unverified, telling the gate staff to just look away.", pts: -1, fb: "Poor Choice. Undermining your own gate staff ruins security credibility. Lose 1 point and choose again.", disc: "How does granting executive exemptions undermine morale among security personnel enforcing site rules?" }
    ],
    next: "d10"
  },
  d10: {
    label: "DAY 3: 11:00 — Fatigued Officers",
    scene: "Due to extended turnaround shifts, your core security roster is exhausted. Several officers have worked 14 days straight, increasing structural observation errors.",
    vocab: ["fatigue", "roster", "mitigation"],
    opts: [

    ],

  },
  d11: {
    label: "DAY 3: 14:00 — Obsolete Hardware",

      { t: "Accept the budget delay and tell your staff to check that area on foot whenever they can.", pts: 1, fb: "Weak coverage. Blind spots near volatile fuel transfers invite significant security incidents.", disc: "Why is manual foot patrol an inadequate replacement for continuous high-risk CCTV monitoring?" },

  d12: {
    label: "DAY 3: 16:15 — The Final Choice",
    scene: "A community activist group gathers outside the north logistics gate. They are peaceful but blocking fuel trucks. The Operations Lead wants you to clear them using force.",
    vocab: ["escalation", "liaison", "logistics"],
    opts: [
      { t: "Coordinate with local police liaisons to safely reroute transport traffic while monitoring the crowd peacefully.", pts: 3, fb: "Superb resolution. De-escalation protects both human life and facility reputation.", disc: "Why is police liaison coordination preferable to private security intervention during public protests?" },
      { t: "Order security officers to push the protesters away from the roadway using batons.", pts: 1, fb: "Highly volatile. Forceful actions escalate protests into media public-relations crises.", disc: "What legal and public relations fallout can occur when private security uses physical force on peaceful groups?" },
      { t: "Lock all gates and let the fuel trucks pile up across the public highway indefinitely.", pts: -1, fb: "Poor Choice. You have completely paralyzed supply chains and created a major traffic hazard. Lose 1 point and choose again.", disc: "How does passive inaction during blockades harm surrounding community infrastructure and supply chains?" }

function fisherYatesShuffle(array) {
  const arr = [...array];
  for (let i = arr.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
  return arr;
}

function buildDots(id) {
  const stages = ["d1", "d2", "d3", "d4", "emergency1", "d5", "d6", "d7", "d8", "emergency2", "d9", "d10", "d11", "d12"];
  const curIdx = stages.indexOf(id);
  const el = document.getElementById('dots');
  if (!el) return;
  el.innerHTML = '';
  stages.forEach((stageId, i) => {
    const d = document.createElement('div');
    d.className = 'dot' + (i < curIdx ? ' done' : i === curIdx ? ' active' : '');
    if (stageId.includes('emergency') && i === curIdx) d.className += ' emg';
    el.appendChild(d);
  });
}

function show(id) {
  if (!DATA[id]) {
    finish(false);
    return;
  }
  const node = DATA[id];
  S.answered = false;
  
  const bar = document.getElementById('card-bar');
  if (bar) bar.style.display = 'flex';
  buildDots(id);
  
  let h = `<div class="card-body"><div class="time-label">${node.label}</div>`;
  if(node.vocab) h += `<div class="vocab-row">${node.vocab.map(v=>`<span class="vpill">${v}</span>`).join('')}</div>`;
  h += `<div class="scenario">${node.scene}</div><div class="options" id="opt-container">`;
  
  let displayOpts = fisherYatesShuffle(node.opts);
  
  displayOpts.forEach((o, idx) => {
    const safeOptionStr = JSON.stringify(o).replace(/'/g, "&#39;").replace(/"/g, '&quot;');
    h += `<button class="opt" id="opt-${idx}" onclick='pick("${id}", ${idx}, ${safeOptionStr})'>
            <span>${o.t}</span>
          </button>`;
  });
  h += `</div>
        <div class="fbox" id="fb"></div>
        <div class="disc-box" id="disc"></div>
        <button class="nxt" id="nxt">Continue →</button>
        </div>`;
  document.getElementById('content').innerHTML = h;
}

function pick(id, idx, opt) {
  if (S.answered && opt.pts !== -1) return;
  
  const fb = document.getElementById('fb');
  const disc = document.getElementById('disc');
  const nxt = document.getElementById('nxt');
  
  fb.innerHTML = opt.fb;
  fb.className = 'fbox show';
  
  if (opt.disc) {
    disc.innerHTML = `<strong>Discussion Question:</strong> ${opt.disc}`;
    disc.className = 'disc-box show';
  } else {
    disc.className = 'disc-box';
  }
  
  if (opt.pts === -1) {
    S.score += opt.pts;
    const scoreEl = document.getElementById('score');
    if (scoreEl) scoreEl.textContent = S.score + ' pts';
    const optBtn = document.getElementById(`opt-${idx}`);
    if (optBtn) optBtn.disabled = true;
    fb.style.backgroundColor = 'var(--red-bg)';
    fb.style.borderColor = 'var(--red-bd)';
    fb.style.color = 'var(--red-tx)';
    return;
  }
  
  S.answered = true;
  
  const optContainer = document.getElementById('opt-container');
  if (optContainer) {
    const allButtons = optContainer.getElementsByTagName('button');
    for (let b of allButtons) {
      b.disabled = true;
    }
  }
  
  if (opt.pts !== undefined) S.score += opt.pts;
  const scoreEl = document.getElementById('score');
  if (scoreEl) scoreEl.textContent = S.score + ' pts';
  
  const isExcellent = opt.pts === 3 || opt.isSafe;
  fb.style.backgroundColor = isExcellent ? 'var(--green-bg)' : 'var(--amber-bg)';
  fb.style.borderColor = isExcellent ? 'var(--green-bd)' : 'var(--amber-bd)';
  fb.style.color = isExcellent ? 'var(--green-tx)' : 'var(--amber-tx)';
  
  if (opt.isGameOver) {
    fb.style.backgroundColor = 'var(--red-bg)';
    fb.style.borderColor = 'var(--red-bd)';
    fb.style.color = 'var(--red-tx)';
    nxt.textContent = "Final Incident Review";
    nxt.onclick = () => finish(true);
  } else {
    nxt.textContent = "Continue →";
    nxt.onclick = () => {
      const nextId = DATA[id] ? DATA[id].next : 'final';
      if (nextId === 'final') {
        finish(false);
      } else {
        show(nextId);
      }
    };
  }
  nxt.classList.add('show');
}

function finish(gameOver) {
  const bar = document.getElementById('card-bar');
  if (bar) bar.style.display = 'none';
  
  let band, title, text, bClass;
  
  if (gameOver) {
    bClass = "band-4"; 
    title = "Band 4: HSE Regulatory Shutdown (Game Over)"; 
    text = "A critical operational safety failure occurred on your watch. In heavy petrochemical industries, breaking core protocols triggers immediate operational suspension, severe infrastructure damage, and potential legal prosecution.";
  } else if (S.score >= 32) {
    bClass = "band-1"; 
    title = "Band 1: Chief HSSE Director (32–36 pts)"; 
    text = "Superb executive capability. You kept the facility safe under incredible production pressures, protected human life, and maintained regulatory compliance effortlessly. Your risk management strategies represent the industry gold standard.";
  } else if (S.score >= 24) {
    bClass = "band-2"; 
    title = "Band 2: Plant Security Superintendent (24–31 pts)"; 
    text = "Solid, capable management. You successfully protected facility assets and completed shift training cycles safely. A few minor compromises were made under production pressure, but overall security integrity remained functional.";
  } else if (S.score >= 12) {
    bClass = "band-3"; 
    title = "Band 3: Junior Safety Supervisor (12–23 pts)"; 
    text = "You survived the shift, but your operational choices were reactive and frequently prioritized short-term speed over site integrity. Review safety protocols and hazard mitigation procedures to improve risk containment.";
  } else {
    bClass = "band-4"; 
    title = "Band 4: Operational Risk (Under 12 pts)"; 
    text = "Severe compliance failures and security gaps compromised plant safety throughout your shift. Bypassing safety regulations led to regulatory vulnerability and heightened facility hazards. Re-examine core protocols and retry the simulation.";
  }

  let glossHtml = `
    <div class="glossary-section">
      <h3 class="glossary-title">Refinery Vocabulary & Core Concepts</h3>
      <div class="glossary-grid">
        ${GLOSSARY.map(g => `
          <div class="g-item">
            <span class="g-term">${g.term}</span>
            <span class="g-def">${g.def}</span>
            <span class="g-note">${g.note}</span>
          </div>
        `).join('')}
      </div>
    </div>`;

  document.getElementById('content').innerHTML = `
    <div class="final-screen">
      <h2 style="font-family:Lora; font-size:26px">Simulation Complete</h2>
      <div style="font-size:16px; margin:10px 0; font-family:'DM Mono'">Final Metric Evaluation: ${S.score} / 36 pts</div>
      <div class="band-box ${bClass}">
        <h3 style="margin-bottom:6px; font-weight:600">${title}</h3>
        <p style="font-size:14px; opacity:0.95">${text}</p>
      </div>
      ${glossHtml}
      <button class="opt" style="justify-content:center; margin-top:24px; font-weight:600; background:var(--ink); color:#fff" onclick="restartGame()">Restart Challenge</button>
    </div>`;
}

function restartGame() {
  S.score = 0;
  S.answered = false;
  start();
}

function start() {
  const bar = document.getElementById('card-bar');
  if (bar) bar.style.display = 'none';
  
  document.getElementById('content').innerHTML = `
    <div class="final-screen" style="text-align:center">
      <h2 style="font-family:Lora; font-size:30px; margin-bottom:0.5rem">PetroShield Global</h2>
      <p style="font-size:15px; margin:1rem 0 1.5rem 0; color:var(--ink2)">
        Step into the role of Head of Security & Safety Training at a Tier 1 petroleum refinery. 
        Balance strict corporate protocol compliance against high-pressure production demands across three turbulent days.
      </p>
      <div style="text-align:left; background:var(--surface2); padding:1rem; border-radius:var(--rs); border:1px solid var(--rule); margin-bottom:1.5rem; font-size:13px; color:var(--ink2)">
        <strong style="display:block; margin-bottom:0.5rem; color:var(--ink)">Simulation Rules & Structure:</strong>
        <ul style="margin-left:1.2rem; line-height:1.5">
          <li><strong>12 Core Dilemmas:</strong> Choose optimal responses (+3 Excellent, +1 Suboptimal, -1 Poor with forced retry).</li>
          <li><strong>2 Critical Emergencies:</strong> Select the correct response to survive. Incorrect choices trigger an immediate <strong>Game Over</strong>.</li>
          <li><strong>Performance Bands:</strong> Achieve up to 36 points across four evaluation tiers.</li>
        </ul>
      </div>
      <button class="opt" style="justify-content:center; background:var(--ink); color:#fff; padding:16px; font-weight:600" onclick="show('d1')">Assume Command →</button>
    </div>`;
}

start();
</script>
</body>
</html>
