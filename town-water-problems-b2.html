<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hydraulic Network Project Director — B2 Interactive</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,600;1,400&family=DM+Sans:ital,wght@0,300;0,400;0,500;1,400&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#F3F4F6;--surface:#FFFFFF;--surface2:#F9FAFB;--surface3:#E5E7EB;
  --ink:#111827;--ink2:#374151;--ink3:#6B7280;
  --rule:rgba(17,24,39,0.08);
  --green-bg:#F0FDF4;--green-bd:#22C55E;--green-tx:#166534;
  --amber-bg:#FFFBEB;--amber-bd:#F59E0B;--amber-tx:#92400E;
  --red-bg:#FEF2F2;--red-bd:#EF4444;--red-tx:#991B1B;
  --blue-bg:#EFF6FF;--blue-bd:#3B82F6;--blue-tx:#1E40AF;
  --purple-bg:#FAF5FF;--purple-bd:#A855F7;--purple-tx:#6B21A8;
  --rxl:16px;--rs:8px;
}
body{font-family:'DM Sans',sans-serif;background:var(--bg);color:var(--ink);line-height:1.6}
.shell{max-width:750px;margin:2rem auto;padding:0 1rem}
.card{background:var(--surface);border-radius:var(--rxl);box-shadow:0 10px 25px -5px rgba(0,0,0,0.05);overflow:hidden;border:1px solid var(--rule)}
.card-bar{display:flex;align-items:center;justify-content:space-between;padding:1rem 1.5rem;background:#fff;border-bottom:1px solid var(--rule)}
.progress-track{display:flex;gap:4px}
.dot{width:10px;height:10px;border-radius:50%;background:var(--surface3)}
.dot.done{background:var(--green-bd)}
.dot.active{background:var(--blue-bd)}
.dot.emg{background:var(--red-bd);animation:pulse 1.2s infinite}
@keyframes pulse{0%{opacity:1}50%{opacity:0.4}100%{opacity:1}}
.score-chip{font-family:'DM Mono',monospace;font-size:13px;background:var(--blue-bg);color:var(--blue-tx);padding:4px 12px;border-radius:20px;border:1px solid var(--blue-bd)}
.card-body{padding:1.5rem;animation:slideUp 0.35s ease-out}
@keyframes slideUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.time-label{font-family:'DM Mono',monospace;font-size:11px;color:var(--ink3);text-transform:uppercase;letter-spacing:0.05em;margin-bottom:0.5rem}
.vocab-row{margin-bottom:1rem;display:flex;flex-wrap:wrap;gap:4px}
.vpill{font-family:'DM Mono',monospace;font-size:10px;background:var(--surface2);color:var(--ink2);padding:2px 8px;border-radius:12px;border:1px solid var(--rule)}
.scenario{font-size:16px;margin-bottom:1.5rem;color:var(--ink);font-weight:400}
.opt{width:100%;text-align:left;padding:14px;background:var(--surface);border:1px solid var(--rule);border-radius:var(--rs);cursor:pointer;margin-bottom:10px;font-size:14px;transition:0.15s;display:flex;justify-content:space-between;align-items:center;color:var(--ink)}
.opt:hover{background:var(--surface2);border-color:var(--ink3)}
.opt:disabled{opacity:0.6;cursor:not-allowed;background:var(--surface3)}
.fbox{margin-top:1rem;padding:1rem;border-radius:var(--rs);font-size:14px;display:none;border-left:4px solid}
.fbox.show{display:block}
.disc-box{margin-top:0.75rem;padding:0.85rem 1rem;border-radius:var(--rs);font-size:13px;font-style:italic;background:var(--purple-bg);border-left:4px solid var(--purple-bd);color:var(--purple-tx);display:none}
.disc-box.show{display:block}
.nxt{margin-top:1.5rem;padding:12px 24px;background:var(--ink);color:#fff;border:none;border-radius:var(--rs);cursor:pointer;display:none;float:right;font-weight:600}
.nxt.show{display:block}
.final-screen{padding:2.5rem}
.band-box{margin:1.5rem 0;padding:1.5rem;border-radius:var(--rs);text-align:left}
.band-1{background:var(--green-bg);border:1px solid var(--green-bd);color:var(--green-tx)}
.band-2{background:var(--blue-bg);border:1px solid var(--blue-bd);color:var(--blue-tx)}
.band-3{background:var(--amber-bg);border:1px solid var(--amber-bd);color:var(--amber-tx)}
.band-4{background:var(--red-bg);border:1px solid var(--red-bd);color:var(--red-tx)}

.glossary-section {margin-top:2.5rem; border-top:2px solid var(--surface3); padding-top:1.5rem;}
.glossary-title {font-family:Lora; font-size:22px; margin-bottom:1.2rem;}
.glossary-grid {display:grid; grid-template-columns:1fr; gap:15px;}
.g-item {background:var(--surface2); padding:12px; border-radius:var(--rs); border:1px solid var(--rule);}
.g-term {font-family:'DM Mono',monospace; font-weight:600; color:var(--blue-tx); display:block; margin-bottom:4px; font-size:14px;}
.g-def {font-size:13px; color:var(--ink2); display:block;}
.g-note {font-size:11px; color:var(--ink3); font-style:italic; margin-top:4px; display:block;}
</style>
</head>
<body>

<div class="shell">
  <div class="card" id="main-card">
    <div class="card-bar" id="card-bar" style="display:none">
      <div style="font-family:Lora;font-weight:600">HydroEngineering Simulation</div>
      <div style="display:flex;align-items:center;gap:15px">
        <div class="progress-track" id="dots"></div>
        <div class="score-chip" id="score">0 pts</div>
      </div>
    </div>
    <div id="content"></div>
  </div>
</div>

<script>
const S = { score: 0, answered: false };

const GLOSSARY = [
  { term: "Head Loss", def: "The reduction in total pressure head (resistance) as fluid flows through a hydraulic network due to friction and turbulence.", note: "Essential for sizing booster pumps and pipeline diameters accurately." },
  { term: "Water Hammer", def: "A destructive pressure surge or shock wave caused when a fluid in motion is forced to stop or change direction suddenly.", note: "Can rupture trunk lines if surge tanks or air release valves are not installed." },
  { term: "FIDIC Contract", def: "Standard international engineering construction contract forms widely used in global infrastructure projects.", note: "Strictly defines variation orders, liability periods, and dispute mechanisms." },
  { term: "Booster Pumping Station", def: "A facility designed to increase water pressure within a supply system to transport water to higher elevations.", note: "Requires precise variable frequency drives (VFD) to manage peak demand." },
  { term: "EPC Contract", def: "Engineering, Procurement, and Construction; a turnkey contract where the engineering firm delivers a fully functional asset.", note: "Transfers significant risk to the main contractor for budget and timeline overruns." },
  { term: "Lump-Sum Penalty", def: "Contractual liquidated damages charged to the engineering firm for failing to meet project completion milestones.", note: "Requires continuous financial buffer monitoring during procurement phases." },
  { term: "Transient Flow Modeling", def: "Computer simulation analyzing unsteady flow behavior and pressure surges in pipe networks over time.", note: "Critical prior to commissioning complex cross-border supply networks." },
  { term: "Geotechnical Survey", def: "Engineering investigation of subsoil conditions to assess structural support for pipelines and foundations.", note: "Inadequate surveys lead to severe trench collapse and structural settling risks." }
];

const DATA = {
  // --- PHASE 1 ---
  d1: {
    label: "PHASE 1: DESIGN & MODELING — Head Loss Discrepancy",
    scene: "During hydraulic network modeling for a municipal water expansion in Nantes, your preliminary calculations reveal a potential head loss issue. The municipal client pressures you to approve smaller pipe diameters to cut material costs.",
    vocab: ["head loss", "hydraulic modeling", "diameter"],
    opts: [
      { t: "Accept the smaller diameter to satisfy the client's current budget constraint.", pts: 1, fb: "Suboptimal. Smaller pipe diameters increase flow velocity and friction loss, raising long-term pump energy costs.", disc: "How do you justify higher initial capital expenditure (CAPEX) to a client by highlighting operational expenditure (OPEX) savings?" },
      { t: "Refuse the reduction. Present a lifecycle cost analysis proving that larger diameters optimize long-term pumping energy.", pts: 3, fb: "Excellent. Engineering integrity protects both system efficiency and client budget over time.", disc: "What key metrics should be included in a technical presentation to non-technical municipal stakeholders?" },
      { t: "Bypass hydraulic modeling standards completely and let the field contractor choose the pipe size.", pts: -1, fb: "Poor Choice. You have surrendered engineering oversight and created liability. Lose 1 point and choose again.", disc: "What are the legal consequences for a lead design engineer who delegates structural sizing decisions to field crews?" }
    ],
    next: "d2"
  },
  d2: {
    label: "PHASE 1: CONTRACTUAL NEGOTIATIONS — International FIDIC Scope",
    scene: "You are drafting an international FIDIC contract for a cross-border river basin diversion project. The overseas partner insists on removing the standard Dispute Avoidance/Adjudication Board (DAB) clause to speed up signing.",
    vocab: ["FIDIC", "arbitration", "jurisdiction"],
    opts: [
      { t: "Insist on maintaining the DAB clause or equivalent international dispute resolution mechanisms.", pts: 3, fb: "Correct. Removing neutral dispute resolution exposes your firm to extreme jurisdiction risks overseas.", disc: "Why are standardized FIDIC dispute mechanisms essential when managing cross-border engineering projects?" },
      { t: "Agree to remove the clause, relying on informal email agreements between project managers.", pts: 1, fb: "Risky. Informal arrangements carry zero legal weight in international arbitration during serious claims.", disc: "How do informal contractual alterations undermine corporate legal protection during international disputes?" },
      { t: "Sign the altered contract immediately without legal review to secure the project award.", pts: -1, fb: "Poor Choice. You expose your firm to unquantified financial and legal liabilities. Lose 1 point and choose again.", disc: "What risks does a project manager assume when signing international contracts without corporate legal sign-off?" }
    ],
    next: "d3"
  },
  d3: {
    label: "PHASE 1: GEOTECHNICAL DISCOVERY — Soil Instability",
    scene: "Core soil samples along a proposed 12-kilometer trunk line reveal loose, saturated silt not accounted for in the original tender. The client demands you maintain the original trenching schedule.",
    vocab: ["geotechnical", "trunk line", "mitigation"],
    opts: [
      { t: "Instruct the trenching team to work faster before the trench walls collapse.", pts: 1, fb: "Unsafe. Saturated soil poses catastrophic trench wall failure risks to site personnel.", disc: "Why is speed the wrong operational variable to manipulate when facing subsoil instability?" },
      { t: "Issue a formal variation notice, redesign trench shoring, and adjust the timeline to ensure structural safety.", pts: 3, fb: "Excellent response. Managing unforeseen physical conditions via contractual variation protects life and quality.", disc: "How should a lead engineer document unforeseen ground conditions to support a formal Variation Order?" },
      { t: "Ignore the geotechnical report and proceed with standard unreinforced trench excavations.", pts: -1, fb: "Poor Choice. You are risking immediate structural failure and loss of life. Lose 1 point and choose again.", disc: "What safety and legal liabilities apply when geotechnical recommendations are deliberately ignored?" }
    ],
    next: "d4"
  },
  d4: {
    label: "PHASE 1: PROCUREMENT & BUDGET — Pump Supplier Deficit",
    scene: "The selected overseas manufacturer for high-capacity booster pumps encounters financial distress, threatening a 4-month delivery delay. A secondary local vendor offers compatible units at a 15% price premium.",
    vocab: ["procurement", "booster pump", "contingency"],
    opts: [
      { t: "Wait for the original supplier to resolve their finances to protect your baseline procurement margin.", pts: 1, fb: "Risky delay. Project liquidated damages will quickly exceed the 15% pump price differential.", disc: "How do late-delivery penalties influence procurement decisions when suppliers face financial insolvency?" },
      { t: "Perform technical validation on the local vendor's units and reallocate project contingency funds to cover the cost differential.", pts: 3, fb: "Perfect. Proactive supply chain substitution mitigates schedule slippage and protects project delivery.", disc: "What technical parameters must be re-verified when switching industrial pump manufacturers mid-project?" },
      { t: "Cancel the pumping station component entirely and convert the system to passive gravity flow without recalculating.", pts: -1, fb: "Poor Choice. Converting to gravity flow without hydraulic redesign guarantees supply failure. Lose 1 point and choose again.", disc: "Why must structural design changes undergo complete hydraulic recalculation before project implementation?" }
    ],
    next: "emergency1"
  },

  // --- EMERGENCY 1 ---
  emergency1: {
    label: "PHASE 1: CRITICAL INCIDENT — Transients & Water Hammer",
    scene: "During initial static testing on a newly laid main network section, a technician rapidly closes a main butterfly valve without engaging the automated bypass system, triggering severe transient flow shockwaves.",
    vocab: ["water hammer", "transient flow", "pressure surge"],
    opts: [
      { t: "Order immediate manual isolation of downstream valves and slam shut all main supply lines to contain the water.", isGameOver: true, fb: "<strong>GAME OVER.</strong> Catastrophic Surge. Shutting downstream valves violently amplifies the reflected shockwave, bursting the main trunk line and flooding the local district.", disc: "Why does sudden valve closure exacerbate transient water hammer phenomena in pressurized distribution lines?" },
      { t: "Activate automated pressure relief valves immediately, lock pump speeds, and gradually bleed off excess pressure.", isSafe: true, fb: "Correct. Controlled pressure dissipation prevented structural trunk line rupture.", disc: "What automated surge control mechanisms are essential for protecting large-scale distribution networks?" }
    ],
    next: "d5"
  },

  // --- PHASE 2 ---
  d5: {
    label: "PHASE 2: EXECUTION & SUPERVISION — Subcontractor Non-Compliance",
    scene: "On an international project site, a civil subcontractor is using non-certified concrete mix ratios for the foundation of a 5,000 m³ elevated storage reservoir.",
    vocab: ["specification", "compliance", "structural integrity"],
    opts: [
      { t: "Issue a formal Stop Work Order, reject the poured non-compliant foundations, and mandate lab-certified testing.", pts: 3, fb: "Outstanding leadership. Reservoir structural integrity cannot be compromised under any circumstances.", disc: "How do you handle severe pushback from regional subcontractors when enforcing strict technical standards?" },
      { t: "Allow the pour to finish but reduce their milestone payment by 5% as a penalty.", pts: 1, fb: "Dangerous compromise. Financial penalties do not prevent structural collapse under hydraulic loads.", disc: "Why are financial deductions an unacceptable substitute for structural safety compliance?" },
      { t: "Sign off on the foundation anyway to maintain goodwill with the local construction firm.", pts: -1, fb: "Poor Choice. Falsifying structural approval exposes you to criminal negligence. Lose 1 point and choose again.", disc: "What ethical responsibilities govern an engineering lead when signing quality assurance documents?" }
    ],
    next: "d6"
  },
  d6: {
    label: "PHASE 2: FINANCIAL MANAGEMENT — Currency Fluctuation",

    opts: [

      { t: "Activate contractual force majeure / economic equilibrium clauses and negotiate a budget amendment with the client.", pts: 3, fb: "Excellent financial management. Contractual risk mitigation mechanisms protect project solvency.", disc: "How do international contracts protect engineering firms against extreme foreign exchange volatility?" },
      { t: "Conceal the price increases from corporate management and stop paying site suppliers.", pts: -1, fb: "Poor Choice. Halting supplier payments halts field execution and triggers legal default. Lose 1 point and choose again.", disc: "Why is financial transparency critical when managing international infrastructure project budgets?" }
    ],
    next: "d7"
  },
  d7: {
    label: "PHASE 2: ENVIRONMENTAL & REGULATORY — Aquifer Contamination",
    scene: "Environmental inspectors in France flag that pipeline trenching activity is encroaching on a protected groundwater protection zone (périmètre de protection).",
    vocab: ["environmental compliance", "aquifer", "regulatory"],
    opts: [
      { t: "Offer a small informal settlement to the field inspector to ignore the boundary line.", pts: 1, fb: "Illegal and unethical. Exposes the company to severe regulatory fines and prosecution.", disc: "Why are anti-bribery policies non-negotiable in international and domestic infrastructure management?" },
      { t: "Halt work in the zone, deploy environmental containment barriers, and request an official route modification permit.", pts: 3, fb: "Superb integrity. Protecting water resources aligns with legal regulatory requirements.", disc: "How should project leads balance environmental regulatory compliance against strict project completion deadlines?" },
      { t: "Accelerate trench excavation at night so the work is completed before formal stop orders arrive.", pts: -1, fb: "Poor Choice. Deliberate regulatory violation leads to project shutdown and license revocation. Lose 1 point and choose again.", disc: "What long-term reputational damage occurs when engineering firms bypass environmental laws?" }
    ],
    next: "d8"
  },
  d8: {
    label: "PHASE 2: SCADA INTEGRATION — Cyber-Physical Vulnerability",
    scene: "During the integration of SCADA telemetry for remote valve control across a regional network, IT security reports unencrypted communication protocols between field sensors and the central control room.",
    vocab: ["SCADA", "telemetry", "cybersecurity"],
    opts: [
      { t: "Proceed with commissioning, assuming water networks are rarely targeted by cyber threats.", pts: 1, fb: "Risky assumption. Critical water infrastructure is a frequent target for industrial cyber-attacks.", disc: "Why is industrial cybersecurity just as vital as physical infrastructure security in modern water utilities?" },
      { t: "Delay remote control commissioning until end-to-end encryption protocols and secure industrial firewalls are implemented.", pts: 3, fb: "Correct security posture. Securing digital control systems prevents malicious operational takeover.", disc: "What protocols should be established between SCADA systems and corporate IT infrastructure?" },
      { t: "Disable telemetry entirely and permanently operate all network valves using manual field crews.", pts: -1, fb: "Poor Choice. Manual operation renders modern large-scale network control inefficient and costly. Lose 1 point and choose again.", disc: "Why is complete abandonment of automation an unsustainable strategy for modern utility networks?" }
    ],
    next: "emergency2"
  },

  // --- EMERGENCY 2 ---
  emergency2: {
    label: "PHASE 2: CRITICAL INCIDENT — Contamination Ingress",
    scene: "During final pressure flushing of a primary drinking water trunk line, back-siphonage occurs due to a sudden pressure drop, drawing untreated industrial runoff into the distribution line.",
    vocab: ["back-siphonage", "cross-connection", "contamination"],
    opts: [
      { t: "Isolate the network section immediately, issue a public boil-water advisory, and initiate full chemical shock disinfection and flushing.", isSafe: true, fb: "Perfect crisis control. Rapid containment and transparent public notification prevented public health impact.", disc: "What procedures govern the decontamination and re-certification of compromised public water mains?" },
      { t: "Increase pump pressure to clear the line quickly without informing public health authorities, hoping dilution solves it.", isGameOver: true, fb: "<strong>GAME OVER.</strong> Severe Public Health Disaster. Untreated industrial runoff reaches municipal distribution points, causing widespread illness and legal prosecution.", disc: "Why must environmental health authorities be notified immediately during cross-connection incidents?" }
    ],
    next: "d9"
  },

  // --- PHASE 3 ---
  d9: {
    label: "PHASE 3: COMMISSIONING & HANDOVER — Client Scope Creep",
    scene: "During pre-commissioning in an overseas project, the client's representative demands the addition of two unmetered branch lines without extending the project timeline or providing additional funding.",
    vocab: ["scope creep", "commissioning", "variation order"],
    opts: [
      { t: "Firmly reject informal additions. Require a signed formal Contract Variation Order including extended deadlines and cost adjustment.", pts: 3, fb: "Outstanding contractual control. Defending scope boundaries prevents project margin erosion.", disc: "How do you diplomatically reject informal scope expansion requests while maintaining client trust?" },
      { t: "Perform the work quietly to secure future contracts with the municipal authority.", pts: 1, fb: "Uncontrolled scope creep. Unfunded variations erode project profit margins and delay milestone delivery.", disc: "Why does accepting unbudgeted work rarely guarantee future business success?" },
      { t: "Instruct site workers to fake the installation of the branch lines on technical drawings.", pts: -1, fb: "Poor Choice. Misrepresenting physical works constitutes fraud. Lose 1 point and choose again.", disc: "What legal consequences arise from falsifying as-built engineering drawings?" }
    ],
    next: "d10"
  },
  d10: {
    label: "PHASE 3: RESOURCE ALLOCATION — Staff Burnout",
    scene: "Your core design and field supervision team has been working 70-hour weeks for two months due to overlapping commissioning schedules in France and abroad. Design error rates in CAD submittals are rising rapidly.",
    vocab: ["resource management", "quality control", "burnout"],
    opts: [
      { t: "Offer overtime financial bonuses to incentivize the engineering team to maintain the pace.", pts: 1, fb: "Inadequate long-term fix. Monetary incentives cannot overcome cognitive fatigue in technical design work.", disc: "Why are financial bonuses ineffective at mitigating structural technical errors caused by fatigue?" },
      { t: "Reallocate senior engineers from parallel project phases, enforce mandatory time off, and implement dual-peer design reviews.", pts: 3, fb: "Excellent resource management. Safeguarding team capacity directly protects engineering output quality.", disc: "What mechanisms can engineering leads use to balance workload across domestic and international projects?" },
      { t: "Reduce quality assurance review steps to allow fatigued engineers to submit drawings faster.", pts: -1, fb: "Poor Choice. Cutting QA/QC steps during high-fatigue periods guarantees major field failures. Lose 1 point and choose again.", disc: "How does removing peer-review steps compromise structural project safety?" }
    ],
    next: "d11"
  },
  d11: {
    label: "PHASE 3: ASSET HANDOVER — Missing As-Built Documentation",
    scene: "The operational handover deadline is in 48 hours. The field survey team has failed to submit complete GIS mapping for buried valve locations on a 30 km pipeline stretch.",
    vocab: ["as-built drawings", "GIS", "handover"],
    opts: [
      { t: "Submit estimated valve locations using preliminary design drawings to meet the 48-hour deadline.", pts: 1, fb: "Risky compromise. Inaccurate GIS data causes severe maintenance delays during future network bursts.", disc: "What operational hazards occur when utility operators rely on inaccurate as-built GIS coordinates?" },
      { t: "Notify the client of a partial documentation handover, deploy a high-priority GPS survey crew, and deliver verified GIS data.", pts: 3, fb: "Great professional transparency. Verified as-built data ensures operational reliability for the client.", disc: "How should engineering directors negotiate conditional handover approvals when minor deliverables are delayed?" },
      { t: "Delete the unmapped section from the final asset register so the files match.", pts: -1, fb: "Poor Choice. Hiding physical assets creates massive operational and safety hazards. Lose 1 point and choose again.", disc: "What liabilities does an engineering firm incur when omitting underground utilities from final registers?" }
    ],
    next: "d12"
  },
  d12: {
    label: "PHASE 3: FINAL CLAIM RESOLUTION — Dispute Settlement",
    scene: "The client threatens to hold back 10% final retention money over disputed performance metrics during initial booster pump testing. Your data proves the issue stems from municipal power supply instability, not pump specifications.",
    vocab: ["retention money", "claim resolution", "dispute"],
    opts: [
      { t: "Compile power quality log data, present independent electrical audit reports, and issue a formal claim for retention release.", pts: 3, fb: "Superb contractual defense. Data-driven technical evidence protects earned project margins.", disc: "How can technical monitoring data be effectively used to defend contractual financial claims?" },
      { t: "Accept the 10% financial deduction to close the project file quickly and avoid legal discussions.", pts: 1, fb: "Weak financial recovery. Conceding legitimate claims unnecessarily destroys project profitability.", disc: "When is it appropriate to compromise on financial claims versus pursuing formal dispute resolution?" },
      { t: "Shut off the regional water network supply valves until the client pays the final invoice.", pts: -1, fb: "Poor Choice. Unauthorized physical disruption of public utilities is illegal and catastrophic. Lose 1 point and choose again.", disc: "Why are physical retaliatory actions strictly illegal in commercial contract disputes?" }
    ],
    next: "final"
  }

function fisherYatesShuffle(array) {
  const arr = [...array];
  for (let i = arr.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
  return arr;
}

function buildDots(id) {
  const stages = ["d1", "d2", "d3", "d4", "emergency1", "d5", "d6", "d7", "d8", "emergency2", "d9", "d10", "d11", "d12"];
  const curIdx = stages.indexOf(id);
  const el = document.getElementById('dots');
  if (!el) return;
  el.innerHTML = '';
  stages.forEach((stageId, i) => {
    const d = document.createElement('div');
    d.className = 'dot' + (i < curIdx ? ' done' : i === curIdx ? ' active' : '');
    if (stageId.includes('emergency') && i === curIdx) d.className += ' emg';
    el.appendChild(d);
  });
}

function show(id) {
  if (!DATA[id]) {
    finish(false);
    return;
  }
  const node = DATA[id];
  S.answered = false;
  
  const bar = document.getElementById('card-bar');
  if (bar) bar.style.display = 'flex';
  buildDots(id);
  
  let h = `<div class="card-body"><div class="time-label">${node.label}</div>`;
  if(node.vocab) h += `<div class="vocab-row">${node.vocab.map(v=>`<span class="vpill">${v}</span>`).join('')}</div>`;
  h += `<div class="scenario">${node.scene}</div><div class="options" id="opt-container">`;
  
  let displayOpts = fisherYatesShuffle(node.opts);
  
  displayOpts.forEach((o, idx) => {
    const safeOptionStr = JSON.stringify(o).replace(/'/g, "&#39;").replace(/"/g, '&quot;');
    h += `<button class="opt" id="opt-${idx}" onclick='pick("${id}", ${idx}, ${safeOptionStr})'>
            <span>${o.t}</span>
          </button>`;
  });
  h += `</div>
        <div class="fbox" id="fb"></div>
        <div class="disc-box" id="disc"></div>
        <button class="nxt" id="nxt">Continue →</button>
        </div>`;
  document.getElementById('content').innerHTML = h;
}

function pick(id, idx, opt) {
  if (S.answered && opt.pts !== -1) return;
  
  const fb = document.getElementById('fb');
  const disc = document.getElementById('disc');
  const nxt = document.getElementById('nxt');
  
  fb.innerHTML = opt.fb;
  fb.className = 'fbox show';
  
  if (opt.disc) {
    disc.innerHTML = `<strong>Technical Discussion Question:</strong> ${opt.disc}`;
    disc.className = 'disc-box show';
  } else {
    disc.className = 'disc-box';
  }
  
  if (opt.pts === -1) {
    S.score += opt.pts;
    const scoreEl = document.getElementById('score');
    if (scoreEl) scoreEl.textContent = S.score + ' pts';
    const optBtn = document.getElementById(`opt-${idx}`);
    if (optBtn) optBtn.disabled = true;
    fb.style.backgroundColor = 'var(--red-bg)';
    fb.style.borderColor = 'var(--red-bd)';
    fb.style.color = 'var(--red-tx)';
    return;
  }
  
  S.answered = true;
  
  const optContainer = document.getElementById('opt-container');
  if (optContainer) {
    const allButtons = optContainer.getElementsByTagName('button');
    for (let b of allButtons) {
      b.disabled = true;
    }
  }
  
  if (opt.pts !== undefined) S.score += opt.pts;
  const scoreEl = document.getElementById('score');
  if (scoreEl) scoreEl.textContent = S.score + ' pts';
  
  const isExcellent = opt.pts === 3 || opt.isSafe;
  fb.style.backgroundColor = isExcellent ? 'var(--green-bg)' : 'var(--amber-bg)';
  fb.style.borderColor = isExcellent ? 'var(--green-bd)' : 'var(--amber-bd)';
  fb.style.color = isExcellent ? 'var(--green-tx)' : 'var(--amber-tx)';
  
  if (opt.isGameOver) {
    fb.style.backgroundColor = 'var(--red-bg)';
    fb.style.borderColor = 'var(--red-bd)';
    fb.style.color = 'var(--red-tx)';
    nxt.textContent = "Final Project Review";
    nxt.onclick = () => finish(true);
  } else {
    nxt.textContent = "Continue →";
    nxt.onclick = () => {
      const nextId = DATA[id] ? DATA[id].next : 'final';
      if (nextId === 'final') {
        finish(false);
      } else {
        show(nextId);
      }
    };
  }
  nxt.classList.add('show');
}

function finish(gameOver) {
  const bar = document.getElementById('card-bar');
  if (bar) bar.style.display = 'none';
  
  let band, title, text, bClass;
  
  if (gameOver) {
    bClass = "band-4"; 
    title = "Band 4: Major Infrastructure Failure (Game Over)"; 
    text = "A critical engineering or public health failure occurred under your direction. In hydraulic network engineering, breaching technical protocols or safety containment leads to environmental disasters, asset destruction, and severe legal liability.";
  } else if (S.score >= 32) {
    bClass = "band-1"; 
    title = "Band 1: Chief Engineering Director (32–36 pts)"; 
    text = "Exceptional project leadership. You balanced technical rigor, financial constraints, FIDIC contractual compliance, and international team management effortlessly. Your decisions represent the global benchmark for hydraulic engineering leadership.";
  } else if (S.score >= 24) {
    bClass = "band-2"; 
    title = "Band 2: Senior Hydraulic Project Lead (24–31 pts)"; 
    text = "Solid engineering and management performance. You successfully navigated complex technical and financial challenges in France and abroad. A few minor concessions were made under commercial pressure, but overall technical integrity remained sound.";
  } else if (S.score >= 12) {
    bClass = "band-3"; 
    title = "Band 3: Assistant Design Engineer (12–23 pts)"; 
    text = "You delivered the infrastructure, but your operational choices were frequently reactive, prioritizing short-term client demands over robust hydraulic modeling and contractual protections. Review FIDIC standards and surge control protocols.";
  } else {
    bClass = "band-4"; 
    title = "Band 4: Operational Risk (Under 12 pts)"; 
    text = "Severe technical deficiencies, contractual vulnerabilities, and quality control gaps compromised project delivery. Re-examine core hydraulic design principles, contract management guidelines, and retry the challenge.";
  }

  let glossHtml = `
    <div class="glossary-section">
      <h3 class="glossary-title">Hydraulic Engineering Vocabulary & Core Concepts</h3>
      <div class="glossary-grid">
        ${GLOSSARY.map(g => `
          <div class="g-item">
            <span class="g-term">${g.term}</span>
            <span class="g-def">${g.def}</span>
            <span class="g-note">${g.note}</span>
          </div>
        `).join('')}
      </div>
    </div>`;

  document.getElementById('content').innerHTML = `
    <div class="final-screen">
      <h2 style="font-family:Lora; font-size:26px">Simulation Complete</h2>
      <div style="font-size:16px; margin:10px 0; font-family:'DM Mono'">Final Metric Evaluation: ${S.score} / 36 pts</div>
      <div class="band-box ${bClass}">
        <h3 style="margin-bottom:6px; font-weight:600">${title}</h3>
        <p style="font-size:14px; opacity:0.95">${text}</p>
      </div>
      ${glossHtml}
      <button class="opt" style="justify-content:center; margin-top:24px; font-weight:600; background:var(--ink); color:#fff" onclick="restartGame()">Restart Challenge</button>
    </div>`;
}

function restartGame() {
  S.score = 0;
  S.answered = false;
  start();
}

function start() {
  const bar = document.getElementById('card-bar');
  if (bar) bar.style.display = 'none';
  
  document.getElementById('content').innerHTML = `
    <div class="final-screen" style="text-align:center">
      <h2 style="font-family:Lora; font-size:30px; margin-bottom:0.5rem">HydroNetwork Global</h2>
      <p style="font-size:15px; margin:1rem 0 1.5rem 0; color:var(--ink2)">
        Step into the shoes of <strong>Mr. Brown</strong>, Lead Studies Engineer directing high-stakes hydraulic network projects across France and international markets. 
        Manage complex technical design, tight financial budgets, and FIDIC contractual compliance across three key project phases.
      </p>
      <div style="text-align:left; background:var(--surface2); padding:1rem; border-radius:var(--rs); border:1px solid var(--rule); margin-bottom:1.5rem; font-size:13px; color:var(--ink2)">
        <strong style="display:block; margin-bottom:0.5rem; color:var(--ink)">Simulation Rules & Structure:</strong>
        <ul style="margin-left:1.2rem; line-height:1.5">
          <li><strong>12 Core Scenarios:</strong> Choose optimal responses (+3 Excellent, +1 Suboptimal, -1 Poor with forced retry).</li>
          <li><strong>2 Critical Engineering Incidents:</strong> Make the correct operational decision to prevent catastrophic network failure or <strong>Game Over</strong>.</li>
          <li><strong>Performance Bands:</strong> Earn up to 36 points across four technical evaluation tiers.</li>
        </ul>
      </div>
      <button class="opt" style="justify-content:center; background:var(--ink); color:#fff; padding:16px; font-weight:600" onclick="show('d1')">Assume Directorship →</button>
    </div>`;
}

start();
</script>
</body>
</html>
